# Fly.io deployment of the Governor Node reference server.
#
# Quick start (DURABLE, recommended):
#   flyctl launch --no-deploy --copy-config --name <your-app>
#   flyctl volumes create governor_data --size 1 --region lhr
#   flyctl secrets set \
#     GOVERNOR_BOOTSTRAP_TOKEN=$(openssl rand -hex 32) \
#     GOVERNOR_REPLICATION_URL=s3://your-bucket/governor \
#     LITESTREAM_ACCESS_KEY_ID=... \
#     LITESTREAM_SECRET_ACCESS_KEY=... \
#     LITESTREAM_S3_ENDPOINT=https://s3.us-west-002.backblazeb2.com \
#     LITESTREAM_S3_REGION=us-west-002
#   flyctl deploy
#
# Without the GOVERNOR_REPLICATION_URL + LITESTREAM_* secrets the
# container REFUSES TO START — a Fly volume is single-host and a host
# failure loses every attestation. If you accept that for evaluation,
# set `flyctl secrets set GOVERNOR_ALLOW_SINGLE_HOST=true` instead.
# See server/node/README.md for a step-by-step Backblaze B2 walkthrough.
#
# This file lives at the root of the `governor` repo (the published mirror).
# The Dockerfile path is therefore relative to that root.

app = "governor"
primary_region = "lhr"

[build]
  dockerfile = "server/node/Dockerfile"

[env]
  GOVERNOR_DB_PATH = "/data/governor.sqlite"
  GOVERNOR_PUBLIC_ENABLED = "false"

[[mounts]]
  source = "governor_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
