# Build the Governor Node image, push to Artifact Registry, deploy to Cloud Run.
#
# The build context is the `governor/` directory (parent of server/), per
# the Dockerfile's COPY instructions. Submit it as the source so its
# contents land at /workspace/ on the build worker — every path below
# is therefore relative to governor/, NOT to the repo root.
#
# Manual run from the repo root:
#
#   gcloud builds submit governor \
#     --config=governor/deploy/gcp/cloudbuild.yaml \
#     --region=europe-west2 \
#     --substitutions=_REGION=europe-west2,_SERVICE=governor,_REPO=governor
#
# GitHub trigger setup (Cloud Build → Triggers → connect repo):
#   - Cloud Build configuration file location: /governor/deploy/gcp/cloudbuild.yaml
#   - Included files filter: governor/**
#   - Source directory ("Working directory"): governor/   <-- important
#
# Prereqs (one-off, handled by terraform/):
#   - Artifact Registry repo ${_REPO} exists in ${_REGION}
#   - Cloud Run service ${_SERVICE} exists (created by terraform with a placeholder image)
#   - The Cloud Build SA has roles/run.admin and roles/iam.serviceAccountUser

substitutions:
  _REGION: europe-west1
  _SERVICE: governor
  _REPO: governor

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

# $BUILD_ID is always populated (manual submit, GitHub trigger, scheduler);
# $SHORT_SHA is only set on git-triggered builds, so we use $BUILD_ID for
# the unique tag and rely on the build's metadata to record the source SHA.
steps:
  # 1. Build the image. Context = /workspace/ (= contents of governor/).
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=server/node/Dockerfile
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  # 2. Push both tags.
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}

  # 3. Roll the Cloud Run revision. Service shape (scaling, env, secrets,
  #    SA, volumes) is owned by Terraform; this step only swaps the image.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest

timeout: 1200s
